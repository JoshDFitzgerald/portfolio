<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo's Lookout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Tall pixel stage in the middle (matches the picture), moves stacked in columns on both sides. Single dusk theme. */
:root {
  --bg: #191427; --bg-2: #2a2140; --ink: #24140e; --paper: #fff8e6; --sun: #ffb43a; --text: #f3ead2; --muted: #b9add6;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 65%); color: var(--text); font-family: var(--font-body); overflow: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 3.4vw, 46px); letter-spacing: .03em; line-height: 1; }
h1 span { color: var(--sun); }
.hint { margin: 0; color: var(--muted); font-size: clamp(14px, 1.5vw, 19px); }
.tools { display: flex; gap: 8px; }
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 18px; align-items: center; }
.col { display: grid; gap: 10px; align-content: center; }
.col.left { justify-items: end; } .col.right { justify-items: start; }
.board { position: relative; height: 100%; aspect-ratio: 2 / 3; max-width: 100%; box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px #4a3a66, 0 18px 40px rgba(0, 0, 0, .5); background: #0d0a14; overflow: hidden; container-type: inline-size; }
canvas#scene { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
canvas#scene.over { cursor: pointer; }
.bubble { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--font-display); font-weight: 700; font-size: clamp(16px, 9cqw, 56px); line-height: 1; color: var(--ink); background: var(--paper); border: 4px solid var(--ink); padding: .25em .5em; white-space: nowrap; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); z-index: 2; }
.bubble::after { content: ""; position: absolute; left: 30%; bottom: -14px; width: 16px; height: 16px; background: var(--paper); border-right: 4px solid var(--ink); border-bottom: 4px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble.pop { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: translate(-50%, -100%) scale(.3); } to { transform: translate(-50%, -100%) scale(1); } }
.emo, .tool { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 1.5vw, 20px); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 #050308; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; min-width: 9.5em; justify-content: space-between; }
.emo b { font-size: .8em; color: #7a6a4a; }
.emo:active, .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #050308; }
.emo.on { background: var(--sun); }
.tool { min-width: 0; padding: 8px 12px; background: transparent; color: var(--text); border-color: var(--text); }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { flex: none; grid-template-columns: 1fr; }
  .board { height: auto; width: min(100%, 420px); justify-self: center; grid-row: 1; }
  .col, .col.left, .col.right { grid-template-columns: repeat(3, minmax(0, 1fr)); justify-items: stretch; }
  .emo { min-width: 0; justify-content: center; }
  .emo b { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bubble.pop { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Leo's <span>Lookout</span></h1>
      <p class="hint">Tap Leo or hover over him to see what he does. Or pick a move.</p>
    </div>
    <div class="tools">
      <button class="tool" id="soundBtn" type="button" aria-pressed="true">Sound: on</button>
      <button class="tool" id="fsBtn" type="button">Full screen</button>
    </div>
  </header>
  <main class="main">
    <nav class="col left" id="colL" aria-label="Moves"></nav>
    <div class="board" id="board">
      <canvas id="scene" width="120" height="180" aria-label="Leo the lion sitting on a rock at sunset"></canvas>
      <div class="bubble" id="bubble" hidden></div>
    </div>
    <nav class="col right" id="colR" aria-label="More moves"></nav>
  </main>
</div>

const F = { eyeL: [23, 40], eyeR: [38, 40], mouth: [27, 61], head: [31, 40], top: [36, 14], pivot: [62, 162] };
const FUR = '#de7928', FUR_D = '#b55112', INK = '#24140e';

/* ---------- face overlays (in sprite space) ---------- */
function lid(ex, ey) { R(FUR, ex - 3, ey - 3, 7, 6); R(FUR_D, ex - 3, ey - 3, 7, 1); }
function eyes(kind) {
  const K = { k: INK };
  for (const [i, [ex, ey]] of [F.eyeL, F.eyeR].entries()) {
    const k = Array.isArray(kind) ? kind[i] : kind;
    if (!k || k === 'open') continue;
    if (k === 'closed') { lid(ex, ey); pix(['k.....k', '.kkkkk.'], ex - 3, ey, K); }
    else if (k === 'happy') { lid(ex, ey); pix(['..kkk..', '.k...k.', 'k.....k'], ex - 3, ey - 1, K); }
    else if (k === 'wink') { lid(ex, ey); pix(['....kk', '..kk..', 'kk....', '..kk..', '....kk'], ex - 3, ey - 3, K); }
    else if (k === 'heart') { lid(ex, ey); pix(['.kk.kk.', 'khhkhhk', 'khwhhhk', 'khhhhhk', '.khhhk.', '..khk..', '...k...'], ex - 3, ey - 4, { k: INK, h: '#ff3d63', w: '#ffd0da' }); }
    else if (k === 'wide') { pix(['..kkk..', '.kwwwk.', 'kwwwwwk', 'kwwkkwk', 'kwwkkwk', '.kwwwk.', '..kkk..'], ex - 3, ey - 4, { k: INK, w: '#fffbe8' }); }
  }
}
function shades(dy, glint) {
  const [lx, ly] = F.eyeL, [rx] = F.eyeR, y = ly - 3 + dy;
  R('#0e0f14', lx - 6, y, rx - lx + 13, 2); R('#0e0f14', lx - 5, y, 9, 5); R('#0e0f14', rx - 4, y, 9, 5); R('#0e0f14', lx - 4, y + 5, 7, 1); R('#0e0f14', rx - 3, y + 5, 7, 1);
  R('#3a4a6a', lx - 3, y + 2, 3, 1); R('#3a4a6a', rx - 2, y + 2, 3, 1);
  if (glint) { R('#ffffff', rx + 2, y - 2, 1, 7); R('#ffffff', rx - 1, y + 1, 7, 1); }
}
function mouth(kind) {
  const [mx, my] = F.mouth;
  if (kind === 'roar') { pix(['.kkkkkkkkk.', 'kwwrrrrrwwk', 'k.wrrrrrw.k', 'krrrrrrrrrk', 'krrrrrrrrrk', 'krrppppprrk', 'krppppppprk', 'k.wrrrrrw.k', '.kkkkkkkkk.'].map((r) => r.replace(/\./g, 'r')), mx - 5, my - 4, { k: INK, r: '#5a1416', p: '#e8707e', w: '#fff6e0' }); }
  else if (kind === 'grin') { pix(['.kkkkk.', 'kwwwwwk', 'krrprrk', '.kkkkk.'], mx - 3, my - 1, { k: INK, r: '#5a1416', p: '#e8707e', w: '#fff6e0' }); }
  else if (kind === 'o') { pix(['.kkk.', 'krrrk', 'krrrk', '.kkk.'], mx - 2, my - 1, { k: INK, r: '#5a1416' }); }
}
function blush(a) { if (a <= 0) return; c.globalAlpha = a * .85; R('#ff6a86', F.eyeL[0] - 4, F.eyeL[1] + 6, 5, 2); R('#ff6a86', F.eyeR[0], F.eyeR[1] + 6, 5, 2); c.globalAlpha = 1; }

/* ---------- particles ---------- */
const parts = [];
function spawn(type, x, y, vx, vy, life) { parts.push({ type, x, y, vx, vy, life, born: performance.now() }); }
const SPR = {
  heart: [['.h.h.', 'hhhhh', 'hhhhh', '.hhh.', '..h..'], { h: '#ff4d6d' }],
  z: [['zzzz', '..z.', '.z..', 'zzzz'], { z: '#ffffff' }],
  note: [['..nn', '..nn', '..n.', 'nnn.', 'nnn.'], { n: '#fff8e6' }],
  spark: [['..y..', '..y..', 'yyyyy', '..y..', '..y..'], { y: '#fff3a0' }],
  dust: [['dd', 'dd'], { d: '#ffe6b0' }],
  bang: [['r', 'r', 'r', '.', 'r'], { r: '#ff4d4d' }],
};
function drawParts(now, dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i], age = (now - q.born) / 1000;
    if (age > q.life) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    c.globalAlpha = Math.min(1, (q.life - age) * 3);
    const [rows, pal] = SPR[q.type]; pix(rows, Math.round(q.x), Math.round(q.y), pal);
    c.globalAlpha = 1;
  }
}
let rings = [];
function drawRings(now) {
  c.strokeStyle = 'rgba(255,240,200,.7)'; c.lineWidth = 1;
  rings = rings.filter((r) => now - r.t < 700);
  for (const r of rings) { const k = (now - r.t) / 700; c.globalAlpha = 1 - k; c.beginPath(); c.ellipse(r.x, r.y, 4 + k * 50, 3 + k * 36, 0, 0, 7); c.stroke(); }
  c.globalAlpha = 1;
}

/* ---------- ambience: birds + drifting golden dust ---------- */
function ambient(t) {
  for (let i = 0; i < 3; i++) {
    const x = ((i * 50 + t * (.004 + i * .0015)) % 150) - 15, y = 14 + i * 9 + Math.sin(t / 900 + i) * 3, f = Math.floor(t / 230 + i) % 2;
    R('#3a2440', x - 2, y - f, 2, 1); R('#3a2440', x, y, 1, 1); R('#3a2440', x + 1, y - f, 2, 1);
  }
  for (let i = 0; i < 10; i++) {
    const x = (i * 17 + t * .003 * (1 + i % 3)) % W, y = 30 + (i * 29) % 110 + Math.sin(t / 800 + i) * 4;
    if (Math.sin(t / 500 + i * 2) > -.2) R('#ffe6a0', x, y, 1, 1);
  }
}

/* ---------- moves ---------- */
const EMOTES = [
  { id: 'roar', label: 'Roar', dur: 2200, say: 'ROAR!' },
  { id: 'giggle', label: 'Giggle', dur: 1900, say: 'hee hee!' },
  { id: 'wink', label: 'Wink', dur: 1700, say: 'wink!' },
  { id: 'love', label: 'Love', dur: 2400, say: 'aww!' },
  { id: 'sleepy', label: 'Sleepy', dur: 3200, say: 'zzz...' },
  { id: 'surprised', label: 'Surprised', dur: 1600, say: 'WHOA!' },
  { id: 'sneeze', label: 'Sneeze', dur: 2400, say: 'ah... ah...' },
  { id: 'cool', label: 'Cool', dur: 2600, say: 'too cool!' },
  { id: 'dance', label: 'Dance', dur: 3000, say: 'dance party!' },
  { id: 'shy', label: 'Shy', dur: 2400, say: '...hi' },
  { id: 'floss', label: 'Floss', dur: 3000, say: 'floss!' },
  { id: 'dab', label: 'Dab', dur: 2000, say: 'dab!' },
];
let cur = null, last = null, nextSpawn = 0;
function pose(now) {
  const p = { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 + Math.sin(now / 700) * .006, skew: 0, eyes: null, mouth: null, blush: 0, shades: null, glint: false, shake: 0 };
  if (!cur && (now % 4200) < 140) p.eyes = 'closed';
  if (!cur) return p;
  const e = cur.e, k = Math.min(1, (now - cur.start) / e.dur), s = Math.sin, P = Math.PI;
  const every = (ms, fn) => { if (now >= nextSpawn) { nextSpawn = now + ms; fn(); } };
  const [hx, hy] = F.head;
  switch (e.id) {
    case 'roar':
      if (k < .15) { p.sy = .97; p.dy = 2; p.eyes = 'closed'; }
      else if (k < .85) { p.mouth = 'roar'; p.rot = -.035; p.dy = -2; p.sx = p.sy = 1.04; p.shake = 2.5; p.flash = k < .22 ? (.22 - k) * 4 : 0; every(220, () => rings.push({ x: F.mouth[0], y: F.mouth[1], t: now })); if (Math.random() < .3) spawn('dust', hx + (Math.random() - .5) * 60, hy + (Math.random() - .5) * 40, (Math.random() - .5) * 50, -20, .6); }
      break;
    case 'giggle': p.eyes = 'happy'; p.mouth = 'grin'; p.blush = .7; p.dy = -Math.abs(s(k * P * 7)) * 4; p.rot = s(k * P * 7) * .015; break;
    case 'wink': p.eyes = k > .08 && k < .85 ? [null, 'wink'] : null; p.rot = .03; p.dy = k > .1 && k < .8 ? -1 : 0; if (k > .15 && k < .22) every(500, () => spawn('spark', F.eyeR[0] + 4, F.eyeR[1] - 8, 10, -20, .6)); break;
    case 'love': p.eyes = 'heart'; p.blush = 1; p.dy = s(k * P * 4) * 1.5; p.rot = s(k * P * 2) * .02; every(220, () => spawn('heart', hx + (Math.random() - .5) * 40, hy - 18, (Math.random() - .5) * 16, -26, 1.4)); break;
    case 'sleepy': p.eyes = 'closed'; p.dy = 2 + s(now / 600) * .8; p.sy = .985; p.rot = .02; if (k > .15) every(650, () => spawn('z', hx + 18, hy - 16, 12, -16, 1.6)); break;
    case 'surprised': p.eyes = 'wide'; p.mouth = 'o'; p.dy = k < .35 ? -s(k / .35 * P) * 10 : 0; p.sy = k < .35 ? 1.03 : 1; if (k < .1) every(600, () => { spawn('bang', hx - 22, hy - 24, 0, -12, .9); spawn('bang', hx + 22, hy - 24, 0, -12, .9); }); break;
    case 'sneeze':
      if (k < .5) { p.eyes = k < .25 ? null : 'closed'; p.mouth = 'o'; p.rot = -k * .08; p.dy = -k * 3; }
      else if (k < .7) { p.eyes = 'closed'; p.mouth = 'grin'; p.rot = .05; p.dy = 2; p.shake = 1.5; every(50, () => spawn('dust', F.mouth[0] - 4, F.mouth[1], -40 - Math.random() * 60, (Math.random() - .5) * 40, .7)); }
      else { p.eyes = 'happy'; p.blush = .5; }
      break;
    case 'cool': { const drop = Math.min(1, k / .3); p.shades = -24 * (1 - drop) * (1 - drop); p.glint = k > .45 && k < .6; p.rot = k > .3 ? -.02 : 0; break; }
    case 'dance': p.rot = s(k * P * 8) * .06; p.dy = -Math.abs(s(k * P * 8)) * 4; p.eyes = 'happy'; p.mouth = 'grin'; every(300, () => spawn('note', hx + (Math.random() < .5 ? -24 : 26), hy - 10, (Math.random() - .5) * 16, -24, 1.2)); break;
    case 'shy': p.eyes = 'happy'; p.blush = Math.min(1, k * 3); p.rot = .04; p.sx = .985; p.dy = 1; break;
    case 'floss': { const f = s(k * P * 14); p.skew = f * .12; p.dx = -f * 2; p.eyes = 'happy'; p.mouth = 'grin'; every(320, () => spawn('note', hx + (Math.random() < .5 ? -24 : 26), hy - 10, (Math.random() - .5) * 16, -24, 1.2)); break; }
    case 'dab': { const on = k > .15 && k < .85, a = on ? 1 : Math.min(1, k / .15, (1 - k) / .15); p.rot = -.12 * a; p.dx = -3 * a; p.eyes = on ? 'closed' : null; if (on) every(240, () => spawn('spark', 6 + Math.random() * 10, 20 + Math.random() * 10, -10, -20, .5)); break; }
  }
  return p;
}
function play(i) {
  const e = EMOTES[i]; last = i; cur = { e, start: performance.now() }; nextSpawn = 0;
  showBubble(e.say);
  if (e.id === 'sneeze') setTimeout(() => { if (cur && cur.e === e) showBubble('ACHOO!'); }, e.dur * .5);
  sound(e.id);
  document.querySelectorAll('.emo').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
}
function playRandom() { let i; do { i = Math.floor(Math.random() * EMOTES.length); } while (i === last); play(i); }
const bubble = $('#bubble');
function showBubble(text) { bubble.textContent = text; bubble.hidden = false; bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop'); }

/* ---------- sounds (made with code, no files) ---------- */
let ac = null, soundOn = true;
function actx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(a, type, f0, f1, t0, dur, vol) { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, a.currentTime + t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + t0 + dur); g.gain.setValueAtTime(.0001, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(vol, a.currentTime + t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + dur); o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05); }
function noise(a, t0, dur, vol, f0, f1) { const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; const src = a.createBufferSource(); src.buffer = buf; const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, a.currentTime + t0); fl.frequency.exponentialRampToValueAtTime(f1, a.currentTime + t0 + dur); const g = a.createGain(); g.gain.setValueAtTime(.0001, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(vol, a.currentTime + t0 + .05); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + dur); src.connect(fl).connect(g).connect(a.destination); src.start(a.currentTime + t0); src.stop(a.currentTime + t0 + dur + .05); }
function sound(id) {
  if (!soundOn) return; const a = actx(); if (!a) return;
  const notes = (list, type, step, vol) => list.forEach((f, i) => tone(a, type, f, f, i * step, step * .9, vol));
  switch (id) {
    case 'roar': noise(a, .3, 1.4, .55, 1600, 180); tone(a, 'sawtooth', 140, 65, .3, 1.4, .2); tone(a, 'sawtooth', 95, 50, .3, 1.4, .15); break;
    case 'giggle': notes([880, 990, 880, 1050, 940], 'square', .11, .05); break;
    case 'wink': tone(a, 'sine', 1500, 2400, .15, .25, .12); break;
    case 'love': notes([660, 880], 'sine', .22, .14); break;
    case 'sleepy': noise(a, 0, .9, .12, 600, 300); noise(a, 1.4, .9, .1, 400, 200); break;
    case 'surprised': tone(a, 'square', 300, 1200, 0, .3, .07); break;
    case 'sneeze': tone(a, 'sine', 500, 650, 0, .5, .05); tone(a, 'sine', 520, 700, .55, .5, .05); noise(a, 1.2, .45, .45, 5000, 900); break;
    case 'cool': notes([523, 659, 784, 1047], 'triangle', .12, .12); break;
    case 'dance': notes([523, 659, 784, 659, 523, 659, 784, 1047], 'square', .16, .04); break;
    case 'shy': tone(a, 'sine', 700, 500, 0, .3, .08); break;
    case 'floss': notes([392, 392, 523, 392, 392, 523, 587, 523, 392, 392, 523, 659], 'square', .2, .04); break;
    case 'dab': noise(a, .2, .35, .3, 3000, 600); tone(a, 'triangle', 400, 900, .2, .25, .1); break;
  }
}

/* ---------- controls ---------- */
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];
const btn = (e, i) => `<button type="button" class="emo" data-i="${i}">${e.label}<b>${KEYS[i]}</b></button>`;
$('#colL').innerHTML = EMOTES.slice(0, 6).map((e, i) => btn(e, i)).join('');
$('#colR').innerHTML = EMOTES.slice(6).map((e, i) => btn(e, i + 6)).join('');
document.querySelectorAll('.col').forEach((n) => n.addEventListener('click', (ev) => { const b = ev.target.closest('.emo'); if (b) { play(+b.dataset.i); b.blur(); } }));
document.addEventListener('keydown', (ev) => { const ki = KEYS.indexOf(ev.key); if (ki >= 0) play(ki); else if (ev.key === ' ' || ev.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; ev.preventDefault(); playRandom(); } });
const toLocal = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H]; };
const overLeo = (x, y) => x > 12 && x < 118 && y > 12 && y < 164;
let wasOver = false;
cv.addEventListener('pointermove', (ev) => { const [x, y] = toLocal(ev), o = overLeo(x, y); cv.classList.toggle('over', o); if (o && !wasOver && ev.pointerType === 'mouse' && (!cur || performance.now() - cur.start > cur.e.dur * .7)) playRandom(); wasOver = o; });
cv.addEventListener('pointerleave', () => { wasOver = false; cv.classList.remove('over'); });
cv.addEventListener('click', () => playRandom());
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; $('#soundBtn').textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); $('#soundBtn').setAttribute('aria-pressed', String(soundOn)); });
$('#fsBtn').addEventListener('click', async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { $('#fsBtn').textContent = 'Use F11'; } });

/* ---------- loop ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (cur && now - cur.start > cur.e.dur) { cur = null; bubble.hidden = true; document.querySelectorAll('.emo').forEach((b) => b.classList.remove('on')); }
  const p = pose(now), sh = reduce ? 0 : p.shake;
  const ox = Math.round((Math.random() - .5) * sh * 2), oy = Math.round((Math.random() - .5) * sh * 2);
  c.setTransform(1, 0, 0, 1, ox, oy);
  c.drawImage(BG, 0, 0);
  ambient(now);
  // Leo, pivoting at his paws
  const [px, py] = F.pivot;
  c.setTransform(1, 0, 0, 1, ox, oy);
  c.translate(px + p.dx, py + p.dy); c.rotate(p.rot); c.transform(1, 0, p.skew, 1, 0, 0); c.scale(p.sx, p.sy); c.translate(-px, -py);
  // face overlays go onto an unrotated copy first so every pixel stays crisp when Leo tilts
  c = sc; c.clearRect(0, 0, W, H); c.drawImage(LION, 0, 0);
  eyes(p.eyes); mouth(p.mouth); blush(p.blush);
  if (p.shades != null) shades(Math.round(p.shades), p.glint);
  c = main; c.drawImage(spr, 0, 0);
  drawRings(now);
  c.setTransform(1, 0, 0, 1, ox, oy);
  drawParts(now, dt);
  if (p.flash > 0 && !reduce) { c.globalAlpha = p.flash; R('#fff4d0', -4, -4, W + 8, H + 8); c.globalAlpha = 1; }
  c.setTransform(1, 0, 0, 1, 0, 0);
  bubble.style.left = Math.min(70, Math.max(30, (F.top[0] + p.dx) / W * 100 + 6)) + '%';
  bubble.style.top = Math.max(11, (F.top[1] + p.dy) / H * 100 + 2) + '%';
  requestAnimationFrame(frame);
}
Promise.all([BG.decode(), LION.decode()]).catch(() => {}).then(() => requestAnimationFrame(frame));
window.__leo = { play };
})();
</script>
